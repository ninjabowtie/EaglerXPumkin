name: Manual release
run-name: Release ${{ inputs.version }} (${{ inputs.channel }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0 or 0.2.0-beta.2)'
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        type: choice
        default: beta
        options:
          - stable
          - beta
          - alpha
      allow_version_downgrade:
        description: 'Allow a core version lower than the one in rust/Cargo.toml'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time: tags, version bumps and the release itself must not race.
concurrency:
  group: manual-release
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: '1.100.0'

jobs:
  build:
    name: Validate, test and build WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      tree: ${{ steps.stamp.outputs.tree }}
    steps:
      - name: Check out selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != refs/heads/main ]; then
            echo "::error::Releases must be dispatched from main (got $RELEASE_REF)."
            exit 1
          fi

      - name: Test release input handling
        run: python3 -m unittest discover -s rust/tests -p 'test_release.py' -v

      - name: Validate release version
        id: version
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_INPUT_CHANNEL: ${{ inputs.channel }}
          ALLOW_VERSION_DOWNGRADE: ${{ inputs.allow_version_downgrade }}
        run: |
          python3 - <<'PY'
          import importlib.util
          import os
          import sys
          import tomllib
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              'prepare_release', Path('rust/scripts/prepare_release.py'))
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)

          current = tomllib.loads(Path('rust/Cargo.toml').read_text())['workspace']['package']['version']
          try:
              version = release.release_version(
                  os.environ['RELEASE_INPUT_VERSION'], os.environ['RELEASE_INPUT_CHANNEL'])
          except ValueError as error:
              print(f'::error::{error}')
              sys.exit(1)

          def core(text):
              return tuple(int(part) for part in text.split('-', 1)[0].split('.'))

          if core(version) < core(current) and os.environ.get('ALLOW_VERSION_DOWNGRADE') != 'true':
              print(f'::error::Refusing to release {version}: rust/Cargo.toml is already at {current}. '
                    'Enable allow_version_downgrade to override.')
              sys.exit(1)

          tag = f'v{version}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={version}\ntag={tag}\nchannel={os.environ['RELEASE_INPUT_CHANNEL']}\n")
          print(f'Prepared {tag} ({os.environ["RELEASE_INPUT_CHANNEL"]}), workspace version {current}')
          PY

      - name: Reject an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          exists() {
            local path=$1 output
            if output=$(gh api "$path" 2>&1); then
              return 0
            fi
            if [[ "$output" == *'HTTP 404'* ]]; then
              return 1
            fi
            echo "::error::GitHub API request failed for $path: $output" >&2
            exit 1
          }
          if exists "repos/$GH_REPO/releases/tags/$RELEASE_TAG"; then
            echo "::error::A release for $RELEASE_TAG already exists. Choose a new version."
            exit 1
          fi
          if exists "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG"; then
            echo "::error::Tag $RELEASE_TAG already exists. Delete it or choose a new version."
            exit 1
          fi

      - name: Stamp build metadata
        id: stamp
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          python3 rust/scripts/prepare_release.py \
            --version "$RELEASE_INPUT_VERSION" --channel "$RELEASE_INPUT_CHANNEL"
          # The stable publish job commits these two files and verifies the tree hash.
          git add -- rust/Cargo.toml rust/Cargo.lock
          printf 'tree=%s\n' "$(git write-tree)" >> "$GITHUB_OUTPUT"

      - name: Install tested Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component rustfmt --component clippy --target wasm32-wasip2
          rustup default "$RUST_TOOLCHAIN"

      - name: Check formatting and run unit tests
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo test --locked --workspace --target x86_64-unknown-linux-gnu
          cargo clippy --locked --workspace --all-targets \
            --target x86_64-unknown-linux-gnu -- -D warnings
          cargo clippy --locked --lib -p eaglerx-pumpkin \
            --target wasm32-wasip2 -- -D warnings

      - name: Build Pumpkin plugin
        run: ./rust/build.sh

      - name: Package plugin and checksums
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cp LICENSE rust/dist/LICENSE
          cp rust/README.md rust/dist/README.md
          cp rust/eagler.example.toml rust/dist/eagler.example.toml
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('rust/dist/release.json').write_text(json.dumps({
              'version': os.environ['RELEASE_VERSION'],
              'channel': os.environ['RELEASE_CHANNEL'],
              'commit': os.environ['SOURCE_SHA'],
              'target': 'wasm32-wasip2',
              'minecraft_protocol': 777,
          }, indent=2) + '\n')
          PY
          cd rust/dist
          zip "EaglerXPumpkin-$RELEASE_VERSION.zip" \
            EaglerXPumpkin.wasm LICENSE README.md eagler.example.toml release.json
          sha256sum EaglerXPumpkin.wasm "EaglerXPumpkin-$RELEASE_VERSION.zip" > SHA256SUMS

      - name: Store release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.tag }}
          if-no-files-found: error
          retention-days: 30
          path: |
            rust/dist/EaglerXPumpkin.wasm
            rust/dist/EaglerXPumpkin-*.zip
            rust/dist/SHA256SUMS

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
      EXPECTED_TREE: ${{ needs.build.outputs.tree }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Reject an existing tag or release
        run: |
          set -euo pipefail
          exists() {
            local path=$1 output
            if output=$(gh api "$path" 2>&1); then
              return 0
            fi
            if [[ "$output" == *'HTTP 404'* ]]; then
              return 1
            fi
            echo "::error::GitHub API request failed for $path: $output" >&2
            exit 1
          }
          if exists "repos/$GH_REPO/releases/tags/$RELEASE_TAG"; then
            echo "::error::A release for $RELEASE_TAG already exists. Choose a new version."
            exit 1
          fi
          if exists "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG"; then
            echo "::error::Tag $RELEASE_TAG already exists. Delete it or choose a new version."
            exit 1
          fi

      # Only a manually requested stable release writes to main. Beta and alpha
      # releases tag the already-built commit and never push to main.
      # Checkout runs before downloading so its workspace clean cannot remove dist/.
      - name: Check out release source
        if: needs.build.outputs.channel == 'stable'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download checked release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Commit stable version bump
        if: needs.build.outputs.channel == 'stable'
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 rust/scripts/prepare_release.py \
            --version "$RELEASE_INPUT_VERSION" --channel stable
          git add -- rust/Cargo.toml rust/Cargo.lock
          actual_tree=$(git write-tree)
          if [ -z "$EXPECTED_TREE" ] || [ "$actual_tree" != "$EXPECTED_TREE" ]; then
            echo "::error::Stamped source tree $actual_tree does not match the built tree $EXPECTED_TREE."
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $RELEASE_TAG"
          fi
          if ! git push origin HEAD:main; then
            echo "::error::main changed while the release was building. Re-run the workflow for $RELEASE_TAG."
            exit 1
          fi
          echo "Release commit: $(git rev-parse HEAD)"

      - name: Create tag and publish release
        shell: bash
        run: |
          set -euo pipefail

          if [ "$RELEASE_CHANNEL" = stable ]; then
            release_sha=$(git rev-parse HEAD)
          else
            release_sha=$SOURCE_SHA
          fi

          created_tag=false
          finish() {
            local status=$?
            if [ "$status" -ne 0 ] && [ "$created_tag" = true ]; then
              echo "::error::Publishing failed; removing tag $RELEASE_TAG" >&2
              gh release delete "$RELEASE_TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
              gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap finish EXIT

          # Create the tag at the exact commit that was built, so the release can
          # never point somewhere else (e.g. the latest default-branch commit).
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$release_sha" --silent
          created_tag=true

          printf '%s\n\n%s\n\n%s\n' \
            "Pumpkin 26.3 WebSocket gateway - $RELEASE_CHANNEL release." \
            'Install EaglerXPumpkin.wasm in your Pumpkin plugins/ folder. The zip includes setup instructions and example configuration.' \
            "Built from $release_sha with Rust $RUST_TOOLCHAIN for wasm32-wasip2." > release-notes.md

          assets=(
            dist/EaglerXPumpkin.wasm
            "dist/EaglerXPumpkin-$RELEASE_VERSION.zip"
            dist/SHA256SUMS
          )
          flags=(--verify-tag --title "EaglerXPumpkin $RELEASE_VERSION" --notes-file release-notes.md)
          if [ "$RELEASE_CHANNEL" = stable ]; then
            flags+=(--latest)
          else
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" "${flags[@]}"

          trap - EXIT
          printf '### Released [%s](%s/%s/releases/tag/%s)\n' \
            "$RELEASE_TAG" "$GITHUB_SERVER_URL" "$GH_REPO" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
