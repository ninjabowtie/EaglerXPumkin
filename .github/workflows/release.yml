name: Manual release
run-name: Release ${{ inputs.version }} (${{ inputs.channel }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0 or 0.2.0-beta.2)'
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        type: choice
        default: beta
        options:
          - stable
          - beta
          - alpha

permissions:
  contents: read

concurrency:
  group: manual-release-${{ inputs.version }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate, test and build WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Check out selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main

      - name: Test release input handling
        run: python3 -m unittest discover -s rust/tests -p 'test_release.py' -v

      - name: Validate version and stamp build metadata
        id: version
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          python3 rust/scripts/prepare_release.py \
            --version "$RELEASE_INPUT_VERSION" --channel "$RELEASE_INPUT_CHANNEL"

      - name: Reject an existing release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::Tag $RELEASE_TAG already exists. Choose a new version."
            exit 1
          fi

      - name: Install tested Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal \
            --component rustfmt --component clippy --target wasm32-wasip2
          rustup default 1.100.0

      - name: Check formatting and run unit tests
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo test --locked --workspace --target x86_64-unknown-linux-gnu
          cargo clippy --locked --workspace --all-targets \
            --target x86_64-unknown-linux-gnu -- -D warnings
          cargo clippy --locked --lib -p eaglerx-pumkin \
            --target wasm32-wasip2 -- -D warnings

      - name: Build Pumpkin plugin
        run: ./rust/build.sh

      - name: Package plugin and checksums
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cp LICENSE rust/dist/LICENSE
          cp rust/README.md rust/dist/README.md
          cp rust/eagler.example.toml rust/dist/eagler.example.toml
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('rust/dist/release.json').write_text(json.dumps({
              'version': os.environ['RELEASE_VERSION'],
              'channel': os.environ['RELEASE_CHANNEL'],
              'commit': os.environ['SOURCE_SHA'],
              'target': 'wasm32-wasip2',
              'minecraft_protocol': 777,
          }, indent=2) + '\n')
          PY
          cd rust/dist
          zip "EaglerXPumkin-$RELEASE_VERSION.zip" \
            EaglerXPumkin.wasm LICENSE README.md eagler.example.toml release.json
          sha256sum EaglerXPumkin.wasm "EaglerXPumkin-$RELEASE_VERSION.zip" > SHA256SUMS

      - name: Store release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.tag }}
          if-no-files-found: error
          retention-days: 30
          path: |
            rust/dist/EaglerXPumkin.wasm
            rust/dist/EaglerXPumkin-*.zip
            rust/dist/SHA256SUMS

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Download checked release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Create draft with assets, then publish
        shell: bash
        run: |
          printf '%s\n\n%s\n\n%s\n' \
            "Pumpkin 26.3 WebSocket gateway — $RELEASE_CHANNEL release." \
            'Install EaglerXPumkin.wasm in your Pumpkin plugins/ folder. The zip includes setup instructions and example configuration.' \
            "Built from $SOURCE_SHA with Rust 1.100.0 for wasm32-wasip2." > release-notes.md
          flags=()
          latest=true
          if [[ "$RELEASE_CHANNEL" != stable ]]; then
            flags+=(--prerelease)
            latest=false
          fi
          gh release create "$RELEASE_TAG" \
            dist/EaglerXPumkin.wasm "dist/EaglerXPumkin-$RELEASE_VERSION.zip" dist/SHA256SUMS \
            --target "$SOURCE_SHA" --title "EaglerXPumkin $RELEASE_VERSION" \
            --notes-file release-notes.md --draft "${flags[@]}"
          gh release edit "$RELEASE_TAG" --draft=false --latest="$latest"
          printf '### Released [%s](%s/releases/tag/%s)\n' \
            "$RELEASE_TAG" "$GITHUB_SERVER_URL/$GH_REPO" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
