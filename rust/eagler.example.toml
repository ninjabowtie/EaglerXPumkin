listen_port = 8081
backend_port = 25565
listen_address = "0.0.0.0"
backend_address = "127.0.0.1"
server_address = "localhost"
# Exact Minecraft protocol to accept when no range is configured.
# 777 is Minecraft 26.3, the default standalone setup.
minecraft_protocol = 777
# Optional inclusive range of accepted client protocols. With Multiversion as
# the translation proxy, this admits Eaglercraft clients for Minecraft 1.17+
# (protocol 755) through the newest release. Both fields must be set together.
# Leave both unset for the exact-protocol-only default above.
# min_minecraft_protocol = 755
# max_minecraft_protocol = 777
max_connections = 64
connections_per_minute = 30
diagnostics_interval_secs = 60
ip_allowlist = []
ip_blocklist = []
# Optional V5 pause-menu link. Set both or leave both empty.
pause_menu_button = ""
pause_menu_url = ""
# Optional V5 join notification. Leave all three text fields empty to disable.
notification_title = ""
notification_body = ""
notification_source = ""
notification_hide_after_secs = 10
notification_expire_after_secs = 3600
# Optional MOTD animation. Frames cycle on each MOTD query connection until
# the close age is reached. Each entry is one or two lines separated by \n.
# Leave motd_frames empty for the static MOTD above.
motd_frames = []
motd_interval_ms = 250
motd_close_after_ms = 60000
motd = "EaglerXPumpkin\nMinecraft 26.3"
